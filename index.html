<!doctype html>
<html lang="ja">
<head>
  <!-- ===== 画面の「部品」を並べるファイル =====
       ボタンや入力欄などの部品をここに書きます。
       見た目(色や大きさ)は style.css、動きは app.js が担当します。 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <!-- iPhoneで「ホーム画面に追加」したとき、アプリっぽく全画面で開くための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>筋トレ記録</title>
</head>
<body>
  <header class="top">
    <h1>筋トレ記録</h1>
    <nav class="tabs">
      <button class="tab active" data-view="record">記録</button>
      <button class="tab" data-view="history">履歴</button>
      <button class="tab" data-view="mind">マインド</button>
    </nav>
  </header>

  <main>
    <!-- ===== 記録タブ ===== -->
    <section id="view-record" class="view active">
      <!-- ===== やる気スイッチ(音楽・動画アプリを開くボタン) =====
           中身は app.js の renderLinks() が作ります。 -->
      <div class="links-bar">
        <div id="link-buttons" class="link-buttons"></div>
        <button id="link-edit-toggle" class="link-edit-toggle" aria-label="ボタンを編集">編集</button>
      </div>
      <div id="link-editor" class="card link-editor" hidden>
        <div class="card-title">ボタンの編集（名前と開くページのURL）</div>
        <div id="link-edit-rows"></div>
        <button id="link-add" class="chip add">＋ ボタンを追加</button>
        <p class="hint">プレイリストや動画のページで「共有 → リンクをコピー」したURLを貼り付けると、そこへ直接飛べます。</p>
        <button id="link-edit-done" class="primary">完了</button>
      </div>

      <div class="row two">
        <label class="field"><span>日付</span><input type="date" id="date"></label>
        <label class="field"><span>体重 (kg)</span><input type="number" id="bodyweight" inputmode="decimal" step="0.1" placeholder="未入力"></label>
      </div>

      <div class="card">
        <div class="card-title">種目</div>
        <div id="exercise-list" class="chips"></div>
        <p id="previous" class="previous"></p>

        <!-- 「−」「＋」で数字を増減する部品。data-step が1回で増減する量 -->
        <div class="stepper" data-key="weight" data-step="2.5" data-min="0">
          <span class="stepper-label">重さ（0 = 自重）</span>
          <button class="step minus" aria-label="重さを減らす">−</button>
          <input class="stepper-value" type="number" inputmode="decimal" step="0.5">
          <span class="unit">kg</span>
          <button class="step plus" aria-label="重さを増やす">＋</button>
        </div>
        <div class="stepper" data-key="reps" data-step="1" data-min="1">
          <span class="stepper-label">回数</span>
          <button class="step minus" aria-label="回数を減らす">−</button>
          <input class="stepper-value" type="number" inputmode="numeric">
          <span class="unit">回</span>
          <button class="step plus" aria-label="回数を増やす">＋</button>
        </div>
        <div class="stepper" data-key="sets" data-step="1" data-min="1">
          <span class="stepper-label">セット数</span>
          <button class="step minus" aria-label="セット数を減らす">−</button>
          <input class="stepper-value" type="number" inputmode="numeric">
          <span class="unit">セット</span>
          <button class="step plus" aria-label="セット数を増やす">＋</button>
        </div>

        <button id="save" class="primary">記録する</button>
      </div>

      <div class="card">
        <div class="card-title">この日の記録</div>
        <ul id="day-list" class="log"></ul>
      </div>
    </section>

    <!-- ===== マインド日記タブ =====
         話した言葉を文字にして、気分と一緒に残す場所。動きは app.js の「マインド日記」の部分。 -->
    <section id="view-mind" class="view">
      <div class="card">
        <div class="card-title">今日の気分（1つタップ）</div>
        <div id="mind-moods" class="chips"></div>
      </div>

      <div class="card">
        <div class="card-title">ひとこと（話してOK）</div>
        <p class="hint mind-guide">例：「今日のテーマは〇〇。調子は〇〇。次は〇〇する。」</p>
        <button id="mind-mic" class="mic-btn">🎤 押して話す</button>
        <textarea id="mind-text" rows="5" placeholder="ここに文字が入ります。キーボードのマイクで話してもOK"></textarea>
        <button id="mind-save" class="primary">日記に残す</button>
      </div>

      <div class="card">
        <div class="card-title">これまでのマインド日記</div>
        <button id="mind-bulk" class="chip add mind-bulk">まとめてコピー（Claudeに貼る用）</button>
        <ul id="mind-list" class="log"></ul>
      </div>
    </section>

    <!-- ===== 履歴タブ ===== -->
    <section id="view-history" class="view">
      <div id="history"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
